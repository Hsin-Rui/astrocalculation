# Database Schema Definitions (Fixed: Removed conflicting FK)

config:
  extensions:
    - "uuid-ossp"

tables:
  auth_credentials:
    title: "Auth Credentials"
    description: "The Single Source of Truth for User Identity (Account)."
    columns:
      user_entity_id:
        type: "VARCHAR(255) PRIMARY KEY"
        description: "The persistent UUID for this account."
      email:
        type: "VARCHAR(255) NOT NULL UNIQUE"
        description: "Login email. Must be unique system-wide."
      password_hash:
        type: "VARCHAR(512) NOT NULL"
      salt:
        type: "VARCHAR(255) NOT NULL"
      is_verified:
        type: "BOOLEAN DEFAULT FALSE"
      verification_token:
        type: "VARCHAR(255)"
      verification_token_expires_at:
        type: "TIMESTAMP WITH TIME ZONE"
      oauth_provider:
        type: "VARCHAR(50)"
      oauth_subject_id:
        type: "VARCHAR(255)"
      failed_attempts:
        type: "INTEGER DEFAULT 0"
      locked_until:
        type: "TIMESTAMP WITH TIME ZONE"
      reset_token:
        type: "VARCHAR(255)"
      reset_token_expires_at:
        type: "TIMESTAMP WITH TIME ZONE"
      last_login:
        type: "TIMESTAMP WITH TIME ZONE"
      created_at:
        type: "TIMESTAMP WITH TIME ZONE DEFAULT NOW()"
    indices:
      - email
  user_profiles:
    title: "User Profiles"
    description: "Versioning of user details (Name, Birth Data, Photo)."
    columns:
      entry_id:
        type: "UUID PRIMARY KEY DEFAULT uuid_generate_v4()"
        title: "Entry ID"
        description: "Unique surrogate key for this version."
      user_entity_id:
        type: "VARCHAR(255) NOT NULL"
        title: "User Entity ID"
        description: "Links to auth_credentials.user_entity_id."
      valid_from:
        type: "TIMESTAMP WITH TIME ZONE DEFAULT NOW()"
        title: "Valid From"
        description: "Start of validity."
      valid_to:
        type: "TIMESTAMP WITH TIME ZONE"
        title: "Valid To"
        description: "End of validity."
      display_name:
        type: "VARCHAR(255)"
        title: "Display Name"
        description: "User's public name."
      birth_timestamp:
        type: "TIMESTAMP WITH TIME ZONE"
        title: "Birth Timestamp"
        description: "Combined birth date and time in UTC."
      timezone:
        type: "VARCHAR(100)"
        title: "Timezone"
        description: "IANA timezone string."
      city_name:
        type: "VARCHAR(100)"
        title: "City"
        description: "Name of the birth city."
      country:
        type: "VARCHAR(100)"
        title: "Country"
        description: "Name of the birth country."
      lat:
        type: "DOUBLE PRECISION"
        title: "Latitude"
        description: "Geographic latitude."
      lng:
        type: "DOUBLE PRECISION"
        title: "Longitude"
        description: "Geographic longitude."
      profile_photo:
        type: "TEXT"
        title: "Profile Photo"
        description: "Base64 encoded image string."
      created_at:
        type: "TIMESTAMP WITH TIME ZONE DEFAULT NOW()"
        title: "Created At"
        description: "Record creation timestamp."
    foreign_keys:
      - column: user_entity_id
        references: auth_credentials(user_entity_id)
        on_delete: CASCADE
    indices:
      - user_entity_id
  app_sessions:
    title: "Active Sessions"
    description: "Manages active login sessions."
    columns:
      session_token:
        type: "VARCHAR(255) PRIMARY KEY"
      user_entity_id:
        type: "VARCHAR(255) NOT NULL"
      created_at:
        type: "TIMESTAMP WITH TIME ZONE DEFAULT NOW()"
      expires_at:
        type: "TIMESTAMP WITH TIME ZONE NOT NULL"
    foreign_keys:
      - column: user_entity_id
        references: auth_credentials(user_entity_id)
        on_delete: CASCADE

  personal_library:
    title: "Personal Library"
    description: "A collection of saved charts owned by a user."
    columns:
      entry_id:
        type: "UUID PRIMARY KEY DEFAULT uuid_generate_v4()"
        title: "Entry ID"
        description: "Unique surrogate key."
      entity_id:
        type: "UUID NOT NULL"
        title: "Entity ID"
        description: "The persistent ID of the chart."
      user_entity_id:
        type: "VARCHAR(255) NOT NULL"
        title: "User entity ID"
        description: "Links to auth_credentials.user_entity_id."
      valid_from:
        type: "TIMESTAMP WITH TIME ZONE DEFAULT NOW()"
        title: "Valid From"
        description: "Start of validity."
      valid_to:
        type: "TIMESTAMP WITH TIME ZONE"
        title: "Valid To"
        description: "End of validity."
      name:
        type: "VARCHAR(255) NOT NULL"
        title: "Name"
        description: "Name of the person or event."
      birth_timestamp:
        type: "TIMESTAMP WITH TIME ZONE NOT NULL"
        title: "Birth Timestamp"
        description: "Combined birth date and time in UTC."
      timezone:
        type: "VARCHAR(100) NOT NULL"
        title: "Timezone"
        description: "IANA timezone string."
      city_name:
        type: "VARCHAR(100)"
        title: "City"
        description: "Birth city."
      country:
        type: "VARCHAR(100)"
        title: "Country"
        description: "Name of the birth country."
      lat:
        type: "DOUBLE PRECISION"
        title: "Latitude"
        description: "Geographic latitude."
      lng:
        type: "DOUBLE PRECISION"
        title: "Longitude"
        description: "Geographic longitude."
      notes:
        type: "TEXT"
        title: "Notes"
        description: "User notes."
      created_at:
        type: "TIMESTAMP WITH TIME ZONE DEFAULT NOW()"
        title: "Created At"
        description: "Creation timestamp."
    foreign_keys:
      - column: user_entity_id
        references: auth_credentials(user_entity_id)
        on_delete: CASCADE
    indices:
      - entity_id
      - user_entity_id
  app_logs:
    title: "Application Logs"
    description: "Structured logs for debugging and errors."
    columns:
      log_id:
        type: "UUID PRIMARY KEY DEFAULT uuid_generate_v4()"
      timestamp:
        type: "TIMESTAMP WITH TIME ZONE DEFAULT NOW()"
      level:
        type: "VARCHAR(50)"
      event:
        type: "VARCHAR(50)"
      message:
        type: "TEXT"
      context_json:
        type: "JSONB"
      user_entity_id:
        type: "VARCHAR(255)" # Removed NOT NULL
        title: "User Entity ID"
        description: "Optional link to auth_credentials."
    indices:
      - timestamp
      - level
      - event
